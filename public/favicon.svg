<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#4f46e5"/>

  <!-- Bocadillo 1: blanco (inglés) -->
  <g fill="#ffffff">
    <rect x="180" y="240" width="470" height="310" rx="76"/>
    <path d="M290 540 L252 662 L430 545 Z"/>
  </g>
  <!-- puntos del bocadillo 1 -->
  <g fill="#4f46e5">
    <circle cx="320" cy="395" r="34"/>
    <circle cx="415" cy="395" r="34"/>
    <circle cx="510" cy="395" r="34"/>
  </g>

  <!-- Bocadillo 2: esmeralda (español), solapado con borde del fondo -->
