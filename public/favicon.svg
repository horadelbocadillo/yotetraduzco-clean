    <rect x="440" y="510" width="430" height="290" rx="70" fill="#10b981" stroke="#4f46e5" stroke-width="26"/>
    <path d="M760 792 L800 906 L636 796 Z" fill="#10b981"/>
  </g>
  <!-- puntos del bocadillo 2 -->
  <g fill="#ffffff">
    <circle cx="570" cy="655" r="30"/>
