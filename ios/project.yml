name: YoTeTraduzco
options:
  bundleIdPrefix: com.yotetraduzco
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "8.0.0"

targets:
  YoTeTraduzco:
    type: application
    platform: iOS
    sources:
      - YoTeTraduzco
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Kingfisher
    settings:
      base:
        INFOPLIST_FILE: YoTeTraduzco/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
